<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Cookie | Preston's Super Epic and Cool Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <a class="back-link" href="../index.html">&larr; Back to the website</a>
        <section class="hero">
            <p class="eyebrow">A tiny message inside</p>
            <h1>Fortune Cookie</h1>
            <p>Crack open a cookie and discover what is waiting for you.</p>
        </section>

        <section class="game-board" aria-label="Fortune cookie">
            <button class="cookie-button" id="cookieButton" type="button" aria-label="Open the fortune cookie">
                <span class="cookie-face">🍪</span>
                <span class="click-label">OPEN ME</span>
            </button>

            <aside class="fortune-panel">
                <p class="eyebrow">Your fortune</p>
                <div class="fortune-paper" id="fortunePaper">
                    <p id="fortuneText">Your fortune is waiting inside.</p>
                </div>
                <button class="another-button" id="anotherButton" type="button">Tell me another</button>
            </aside>
        </section>
        <p class="tip" id="tip">Click the cookie to reveal your fortune.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
