<body><main><header><a href="../index.html">Back to main page</a><span class="tag">PUZZLE / RANDOM</span></header><section class="intro"><p class="eyebrow">Find your way through</p><h1>Maze<br><span>Generator</span></h1><p>Build a fresh maze, then see if you can solve it.</p></section><section class="controls"><label for="size">Maze size<select id="size"><option value="15">Small</option><option value="21" selected>Medium</option><option value="31">Large</option></select></label><button id="generate" type="button">Generate maze</button><button id="solve" type="button">Show solution</button></section><section class="maze-panel"><canvas id="maze" width="620" height="620" aria-label="Generated maze"></canvas><p id="status" aria-live="polite">Green is the start. Pink is the finish.</p></section><p class="note">Use the controls to generate a different maze whenever you want.</p></main><script src="script.js"></script></body></html>
