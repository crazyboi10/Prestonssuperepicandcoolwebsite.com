<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minesweeper</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>Minesweeper</h1>

        <div class="top-bar">

            <div class="counter">
                💣 <span id="mineCounter">10</span>
            </div>

            <button id="restart">
                🙂
            </button>
            <button id="Exit">Exit</button>

            <div class="counter">
                ⏱️ <span id="timer">0</span>
            </div>

        </div>

        <div id="board"></div>

        <p id="message"></p>

        <button id="cheatButton" class="cheat-button" type="button"
            aria-label="Scan the board" title="Scan the board">🔍</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
