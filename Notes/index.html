<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notes | Preston's Website</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="../index.html">Back to main page</a><span class="tag">LOCAL NOTES</span></header><section class="intro"><p class="eyebrow">Keep track of ideas</p><h1>Notes</h1><p>A simple place for thoughts, plans, and reminders.</p></section><section class="notes-layout"><form id="note-form" class="note-editor"><input id="title" placeholder="Note title" maxlength="80" required><textarea id="body" placeholder="Write your note here..." required></textarea><div class="editor-actions"><button type="submit">Save note</button><button id="cancel" type="button">Cancel</button></div></form><section class="notes-list"><div class="list-heading"><h2>Your notes</h2><input id="search" placeholder="Search notes" aria-label="Search notes"></div><div id="notes" aria-live="polite"></div></section></section><p class="note">Notes are saved in this browser using local storage.</p></main><script src="script.js"></script></body></html>
