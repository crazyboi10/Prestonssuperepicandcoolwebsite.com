<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Playground | Preston's Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header><a href="../index.html">Back to main page</a><span class="tag">PYTHON / BROWSER</span></header>
        <section class="intro">
            <p class="eyebrow">Write something. Run it.</p>
            <h1>Python<br><span>Playground</span></h1>
            <p>A small Python coding space that runs directly in your browser.</p>
        </section>
        <section class="toolbar">
            <div class="examples">
                <label for="example">Starter code</label>
                <select id="example">
                    <option value="hello">Hello world</option>
                    <option value="loop">A tiny loop</option>
                    <option value="math">Make a calculation</option>
                </select>
            </div>
            <button id="run" class="run-button" type="button">Run code</button>
            <button id="clear" class="clear-button" type="button">Clear</button>
        </section>
        <section class="editor-panel">
            <div class="panel-label"><span>main.py</span><span id="status">Ready</span></div>
            <div class="editor-wrap">
                <pre id="line-numbers" aria-hidden="true">1</pre>
                <textarea id="code" spellcheck="false" aria-label="Python code"></textarea>
            </div>
        </section>
        <section class="output-panel">
            <div class="panel-label"><span>Output</span><button id="clear-output" type="button">Clear output</button></div>
            <pre id="output" aria-live="polite">Run your code to see the output here.</pre>
        </section>
        <p class="note">Python runs in this page using Skulpt. Your code stays in the browser and is not uploaded.</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    <script src="script.js"></script>
</body>
</html>
