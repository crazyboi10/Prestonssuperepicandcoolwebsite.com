<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #7c3aed);
      font-family: Arial, sans-serif;
      color: white;
    }
    .game {
      width: min(90vw, 600px);
      background: rgba(15, 23, 42, 0.82);
      border-radius: 18px;
      padding: 24px;
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      text-align: center;
    }
    h1 { margin-top: 0; }
    .scores {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 18px;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .choices {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .choice {
      background: #f59e0b;
      border: none;
      color: #111827;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
    }
    .result {
      margin-top: 18px;
      font-size: 1.3rem;
      min-height: 32px;
    }
    .restart {
      margin-top: 18px;
      background: #22c55e;
      border: none;
      color: white;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Rock Paper Scissors</h1>
    <div class="scores">
      <div>You: <span id="playerScore">0</span></div>
      <div>Computer: <span id="computerScore">0</span></div>
    </div>
    <div class="choices">
      <button class="choice" data-choice="rock">Rock</button>
      <button class="choice" data-choice="paper">Paper</button>
      <button class="choice" data-choice="scissors">Scissors</button>
    </div>
    <div id="result" class="result">Choose your move!</div>
    <button class="restart" id="restart">Reset Score</button>
  </div>

  <script>
    const choices = ['rock', 'paper', 'scissors'];
    const buttons = document.querySelectorAll('.choice');
    const resultEl = document.getElementById('result');
    const playerScoreEl = document.getElementById('playerScore');
    const computerScoreEl = document.getElementById('computerScore');
    const restartBtn = document.getElementById('restart');

    let playerScore = 0;
    let computerScore = 0;

    function getComputerChoice() {
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function decideWinner(player, computer) {
      if (player === computer) return 'Tie!';
      if (
        (player === 'rock' && computer === 'scissors') ||
        (player === 'paper' && computer === 'rock') ||
        (player === 'scissors' && computer === 'paper')
      ) {
        playerScore += 1;
        return 'You win!';
      }
      computerScore += 1;
      return 'Computer wins!';
    }

    function playRound(playerChoice) {
      const computerChoice = getComputerChoice();
      const outcome = decideWinner(playerChoice, computerChoice);

      playerScoreEl.textContent = playerScore;
      computerScoreEl.textContent = computerScore;
      resultEl.textContent = `You picked ${playerChoice}. Computer picked ${computerChoice}. ${outcome}`;
    }

    buttons.forEach(button => {
      button.addEventListener('click', () => playRound(button.dataset.choice));
    });

    restartBtn.addEventListener('click', () => {
      playerScore = 0;
      computerScore = 0;
      playerScoreEl.textContent = 0;
      computerScoreEl.textContent = 0;
      resultEl.textContent = 'Choose your move!';
    });
  </script>
</body>
</html>
