<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #7c3aed);
      font-family: Arial, sans-serif;
      color: white;
    }
    .game {
      width: min(90vw, 600px);
      background: rgba(15, 23, 42, 0.82);
      border-radius: 18px;
      padding: 24px;
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      text-align: center;
    }
    h1 { margin-top: 0; }
    .scores {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 18px;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .choices {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .choice {
      background: #f59e0b;
      border: none;
      color: #111827;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
    }
    .result {
      margin-top: 18px;
      font-size: 1.3rem;
      min-height: 32px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .mode-toggle, .restart, .exit {
      border: none;
      color: white;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
    }
    .mode-toggle {
      background: #2563eb;
    }
    .restart {
      background: #22c55e;
    }
    .exit {
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>Rock Paper Scissors</h1>
    <div class="scores">
      <div id="playerLabel">You: <span id="playerScore">0</span></div>
      <div id="computerLabel">Computer: <span id="computerScore">0</span></div>
    </div>
    <div class="choices">
      <button class="choice" data-choice="rock">Rock</button>
      <button class="choice" data-choice="paper">Paper</button>
      <button class="choice" data-choice="scissors">Scissors</button>
    </div>
    <div id="result" class="result">Choose your move!</div>
    <div class="controls">
      <button class="mode-toggle" id="modeToggle">Play vs Friend</button>
      <button class="restart" id="restart">Reset Score</button>
      <button class="exit" id="exit">Exit</button>
    </div>
  </div>

  <script>
    const choices = ['rock', 'paper', 'scissors'];
    const buttons = document.querySelectorAll('.choice');
    const resultEl = document.getElementById('result');
    const playerLabel = document.getElementById('playerLabel');
    const computerLabel = document.getElementById('computerLabel');
    const restartBtn = document.getElementById('restart');
    const exitBtn = document.getElementById('exit');
    const modeToggleBtn = document.getElementById('modeToggle');

    let playerScoreEl = document.getElementById('playerScore');
    let computerScoreEl = document.getElementById('computerScore');
    let playerScore = 0;
    let computerScore = 0;
    let isAiMode = true;
    let waitingForPlayerTwo = false;
    let playerOneChoice = null;

    function getComputerChoice() {
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function updateScoreboard() {
      playerScoreEl.textContent = String(playerScore);
      computerScoreEl.textContent = String(computerScore);
    }

    function setMode(nextAiMode) {
      isAiMode = nextAiMode;
      modeToggleBtn.textContent = isAiMode ? 'Play vs Friend' : 'Play vs AI';

      if (isAiMode) {
        playerLabel.innerHTML = 'You: <span id="playerScore">' + playerScore + '</span>';
        computerLabel.innerHTML = 'Computer: <span id="computerScore">' + computerScore + '</span>';
        resultEl.textContent = 'Choose your move!';
      } else {
        playerLabel.innerHTML = 'Player 1: <span id="playerScore">' + playerScore + '</span>';
        computerLabel.innerHTML = 'Player 2: <span id="computerScore">' + computerScore + '</span>';
        resultEl.textContent = 'Player 1, choose your move!';
      }

      playerScoreEl = document.getElementById('playerScore');
      computerScoreEl = document.getElementById('computerScore');
      updateScoreboard();
      waitingForPlayerTwo = false;
      playerOneChoice = null;
    }

    function playRound(playerChoice) {
      if (isAiMode) {
        const computerChoice = getComputerChoice();
        let outcome = 'Tie!';

        if (playerChoice === computerChoice) {
          outcome = 'Tie!';
        } else if (
          (playerChoice === 'rock' && computerChoice === 'scissors') ||
          (playerChoice === 'paper' && computerChoice === 'rock') ||
          (playerChoice === 'scissors' && computerChoice === 'paper')
        ) {
          playerScore += 1;
          outcome = 'You win!';
        } else {
          computerScore += 1;
          outcome = 'Computer wins!';
        }

        updateScoreboard();
        resultEl.textContent = `You picked ${playerChoice}. Computer picked ${computerChoice}. ${outcome}`;
        return;
      }

      if (!waitingForPlayerTwo) {
        playerOneChoice = playerChoice;
        waitingForPlayerTwo = true;
        resultEl.textContent = 'Player 2, choose your move!';
        return;
      }

      const playerTwoChoice = playerChoice;
      let outcome = 'Tie!';

      if (playerOneChoice === playerTwoChoice) {
        outcome = 'Tie!';
      } else if (
        (playerOneChoice === 'rock' && playerTwoChoice === 'scissors') ||
        (playerOneChoice === 'paper' && playerTwoChoice === 'rock') ||
        (playerOneChoice === 'scissors' && playerTwoChoice === 'paper')
      ) {
        playerScore += 1;
        outcome = 'Player 1 wins!';
      } else {
        computerScore += 1;
        outcome = 'Player 2 wins!';
      }

      resultEl.textContent = `Player 1 picked ${playerOneChoice}. Player 2 picked ${playerTwoChoice}. ${outcome}`;
      updateScoreboard();
      waitingForPlayerTwo = false;
      playerOneChoice = null;
    }

    buttons.forEach(button => {
      button.addEventListener('click', () => playRound(button.dataset.choice));
    });

    restartBtn.addEventListener('click', () => {
      playerScore = 0;
      computerScore = 0;
      waitingForPlayerTwo = false;
      playerOneChoice = null;
      updateScoreboard();
      resultEl.textContent = isAiMode ? 'Choose your move!' : 'Player 1, choose your move!';
    });

    modeToggleBtn.addEventListener('click', () => {
      const nextAiMode = !isAiMode;
      playerScore = 0;
      computerScore = 0;
      setMode(nextAiMode);
      updateScoreboard();
    });

    exitBtn.addEventListener('click', () => {
      window.location.href = '../index.html';
    });

    setMode(true);
  </script>
</body>
</html>
