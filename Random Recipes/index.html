<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Recipes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="recipe-card">
        <div class="top-row">
          <p class="eyebrow">Food Finder</p>
          <div class="action-row">
            <button class="exit-btn" type="button" onclick="window.location.href='../index.html'">Exit</button>
            <button id="newRecipeBtn" class="new-btn">New Recipe</button>
          </div>
        </div>

        <div id="recipeContent" class="recipe-content loading">
          <div class="loading-text">Loading a tasty recipe...</div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
