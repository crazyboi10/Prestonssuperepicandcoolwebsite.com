<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-panel">
        <div class="top-bar">
          <p class="label">Memory Game</p>
          <button id="startBtn" class="start-btn">Start</button>
        </div>

        <h1>Simon Says</h1>

        <div class="score-wrap">
          <span>Score</span>
          <strong id="scoreValue">0</strong>
        </div>

        <div class="board" aria-label="Simon Says game board">
          <button class="pad pad-green" data-pad="0" aria-label="Green pad"></button>
          <button class="pad pad-red" data-pad="1" aria-label="Red pad"></button>
          <button class="pad pad-yellow" data-pad="2" aria-label="Yellow pad"></button>
          <button class="pad pad-blue" data-pad="3" aria-label="Blue pad"></button>
        </div>

        <p id="message" class="message">Press Start to begin.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
